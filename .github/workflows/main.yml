name: Build and publish PHP 8.5 binaries for iAkunaMC

on:
  push:
    branches: "**"
    tags-ignore: "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # PHP 8.5 only for iAkunaMC (PocketMine-MP 5). Other versions were removed on purpose.
  build-php-8-5:
    name: iAkunaMC - PHP 8.5
    uses: ./.github/workflows/main-pm-matrix.yml
    with:
      pm-version-major: 5
      php-version-base: "8.5"
    secrets: inherit

  publish-archive-release:
    name: Publish archive release
    needs: [build-php-8-5]
    runs-on: ubuntu-22.04
    if: ${{ github.ref_name == 'stable' && github.ref_type == 'branch' && !contains(github.event.head_commit.message, '[no release]') }}
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: ${{ github.workspace }}

      - name: Generate release notes
        run: |
          echo "Built by: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> changelog.md
          echo "Build number: ${{ github.run_number }}" >> changelog.md
          echo -e "\n\nPHP 8.5 with ext-ffi for iAkunaMC. Linux x86_64, Linux arm64 (Azure Cobalt / Neoverse N2) and Android arm64 (static)." >> changelog.md
          echo -e "\nIMPORTANT: download the .zip (not the .tar.gz) if you upload files via FileZilla/Windows/cPanel: the .zip cannot leave .so libs empty." >> changelog.md

      - name: Create release
        uses: ncipollo/release-action@v1.20.0
        with:
          artifacts: |
            ${{ github.workspace }}/*PHP-*-PM*/*.tar.gz
            ${{ github.workspace }}/*PHP-*-PM*/*.zip
          name: PHP 8.5 (Build ${{ github.run_number }}) - Archive
          tag: php-build-${{ github.run_number }}
          commit: ${{ github.sha }}
          allowUpdates: false
          bodyFile: ${{ github.workspace }}/changelog.md

  # ---------------------------------------------------------------------------
  # Publishes the compiled binaries inside the repo itself, on the 'binarios' branch.
  # Each build COMPLETELY replaces the previous content (old binaries are
  # deleted) but keeps README, workflows and other files in the branch.
  # Tarballs include libs as hardlinks (package.sh), so although
  # GitHub shows them as normal folders, no .so lib is lost or left empty.
  # ---------------------------------------------------------------------------
  publish-binaries-branch:
    name: Publish binaries to binarios branch
    needs: [build-php-8-5]
    runs-on: ubuntu-22.04
    if: ${{ github.ref_name == 'stable' && github.ref_type == 'branch' && !contains(github.event.head_commit.message, '[no binaries]') }}
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: ${{ github.workspace }}/artifacts

      - name: Extract tarballs
        run: |
          set -e
          mkdir -p payload
          # Z-* = debugging symbol tarballs: can exceed 100 MB per
          # file and break the branch push; they add no libs or executable binary.
          find artifacts -name '*PHP-*-PM*.tar.gz' ! -name 'Z-*' -print0 | while IFS= read -r -d '' f; do
            artifact_dir="$(basename "$(dirname "$f")")"
            echo "Extracting $f -> payload/$artifact_dir"
            mkdir -p "payload/$artifact_dir"
            tar -xzf "$f" -C "payload/$artifact_dir"
          done
          find payload -maxdepth 2 -type d | sort

      - name: Push binaries to binarios branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global init.defaultBranch binarios
          git clone --depth 1 --branch binarios "https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git" binarios-repo || \
            git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git" binarios-repo
          cd binarios-repo
          if [ ! -d .git ]; then echo "ERROR: clone failed"; exit 1; fi
          if git rev-parse --verify -q origin/binarios >/dev/null; then
            git checkout binarios
          else
            git checkout --orphan binarios
            git rm -rf --ignore-unmatch -q . || true
            echo "# Compiled binaries" > README.md
            echo >> README.md
            echo "This branch is generated automatically by the CI workflow (job publish-binaries-branch)." >> README.md
            echo "Each build deletes previous binaries and uploads new ones. Do not edit manually." >> README.md
          fi
          # Delete only the previously generated content; keep README, workflows, etc.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'README.md' ! -name '.github' -exec rm -rf {} +
          cp -a "${{ github.workspace }}/payload/." .
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "CI: binaries PHP 8.5 build ${{ github.run_number }} (${{ github.sha }})"
            git push origin binarios
          fi
